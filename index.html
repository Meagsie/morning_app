<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Life I'm Building</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#EAEEE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Life">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap">
  <div id="loading" class="loading">Coming into the light</div>
  <div id="view"></div>
</div>
<div id="overlay" class="hidden" onclick="if(event.target===this)closeReset()"></div>
<div id="toast"></div>
<nav id="tabbar" class="hidden">
  <button data-r="home" onclick="go('home')">Today</button>
  <button data-r="morning" onclick="go('morning')">Morning</button>
  <button data-r="close" onclick="go('close')">Evening</button>
  <button data-r="parking" onclick="go('parking')">Park it</button>
</nav>
<script src="./app.js"></script>
</body>
</html>
