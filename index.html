<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Into the Day</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#EAEEE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Into the Day">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAEEE3;
    --paper:#F3F5EC;
    --canopy:#23362A;
    --moss:#5E7857;
    --sage:#889B7C;
    --bark:#5A4A38;
    --leaf:#4E7C53;
    --leaf-bright:#5F9764;
    --line:#CDD6C1;
    --soft:#DDE4D2;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--canopy);
    min-height:100vh;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
    line-height:1.5;
  }
  .wrap{max-width:520px;margin:0 auto;padding:34px 22px 60px;}

  /* header */
  .date{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);font-weight:500;}
  .greet{font-family:'Fraunces',serif;font-weight:500;font-size:34px;line-height:1.08;color:var(--canopy);margin-top:8px;letter-spacing:-.01em;}
  .greet em{font-style:italic;color:var(--moss);}

  .focus{margin-top:20px;border-left:2px solid var(--soft);padding-left:16px;}
  .focus-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);font-weight:600;margin-bottom:7px;}
  .focus ul{list-style:none;}
  .focus li{font-size:15.5px;color:var(--bark);padding:3px 0;display:flex;gap:9px;}
  .focus li span{color:var(--sage);font-family:'Fraunces',serif;font-size:14px;}
  .focus .empty{font-size:14.5px;color:var(--sage);font-style:italic;}

  /* segmented */
  .seg{display:flex;background:var(--soft);border-radius:100px;padding:4px;margin:30px 0 24px;}
  .seg button{flex:1;border:none;background:none;font-family:'Inter';font-size:14px;font-weight:500;color:var(--moss);padding:9px 0;border-radius:100px;cursor:pointer;transition:all .25s;}
  .seg button.on{background:var(--paper);color:var(--canopy);box-shadow:0 1px 3px rgba(35,54,42,.10);font-weight:600;}

  /* sprig */
  .sprig-wrap{display:flex;justify-content:center;margin:6px 0 26px;}
  #sprig{width:118px;height:150px;overflow:visible;}
  #sprig .leaf{transform-origin:center;transition:opacity .55s ease, transform .55s cubic-bezier(.34,1.56,.64,1);}
  #sprig .leaf.hide{opacity:0;transform:scale(.2);}
  #sprig .leaf.show{opacity:1;transform:scale(1);}
  #sprig .bud{transition:opacity .6s ease .1s, transform .6s cubic-bezier(.34,1.56,.64,1) .1s;transform-origin:center bottom;}
  #sprig .bud.hide{opacity:0;transform:scale(0);}
  #sprig .bud.show{opacity:1;transform:scale(1);}

  /* sequence list */
  .list{display:flex;flex-direction:column;gap:11px;}
  .item{
    display:flex;align-items:center;gap:14px;
    background:var(--paper);border:1px solid var(--line);
    border-radius:15px;padding:16px 17px;cursor:pointer;
    transition:border-color .2s, background .3s, transform .12s;
    user-select:none;
  }
  .item:active{transform:scale(.988);}
  .item.done{background:var(--soft);border-color:var(--soft);}
  .tick{
    width:24px;height:24px;border-radius:50%;border:2px solid var(--sage);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    transition:all .3s;
  }
  .item.done .tick{background:var(--leaf);border-color:var(--leaf);}
  .tick svg{width:13px;height:13px;opacity:0;transform:scale(.4);transition:all .3s;}
  .item.done .tick svg{opacity:1;transform:scale(1);}
  .item .txt{display:flex;flex-direction:column;gap:2px;}
  .item .label{font-size:16.5px;color:var(--canopy);transition:color .3s;}
  .item .meta{font-size:12.5px;color:var(--moss);font-style:italic;transition:color .3s;}
  .item.done .label{color:var(--sage);text-decoration:line-through;text-decoration-color:var(--sage);}
  .item.done .meta{color:var(--sage);opacity:.7;}

  .done-msg{text-align:center;margin-top:26px;min-height:26px;}
  .done-msg .big{font-family:'Fraunces',serif;font-style:italic;font-size:23px;color:var(--moss);opacity:0;transform:translateY(6px);transition:all .5s;}
  .done-msg .big.on{opacity:1;transform:translateY(0);}
  .done-msg .sub{font-size:13.5px;color:var(--sage);margin-top:4px;opacity:0;transition:opacity .5s .15s;}
  .done-msg .sub.on{opacity:1;}

  .edit-toggle{display:block;margin:24px auto 0;background:none;border:none;color:var(--sage);font-family:'Inter';font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}

  /* edit mode */
  .editrow{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .editrow .lbl{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:15px;color:var(--canopy);}
  .mini{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--moss);font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .mini:active{background:var(--soft);}
  .addrow{display:flex;gap:8px;margin-top:14px;}
  .addrow input{flex:1;border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-family:'Inter';font-size:15px;color:var(--canopy);background:var(--paper);}
  .addrow input:focus{outline:none;border-color:var(--moss);}
  .addrow button{background:var(--canopy);color:var(--paper);border:none;border-radius:11px;padding:0 18px;font-family:'Inter';font-size:14px;font-weight:500;cursor:pointer;}

  /* tomorrow */
  .t-intro{font-size:15px;color:var(--bark);margin-bottom:20px;}
  .t-label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--sage);font-weight:600;margin-bottom:11px;}
  .t-things{display:flex;flex-direction:column;gap:10px;margin-bottom:26px;}
  .t-thing{display:flex;align-items:center;gap:12px;}
  .t-thing .num{font-family:'Fraunces',serif;font-size:18px;color:var(--sage);width:16px;}
  .t-thing input{flex:1;border:none;border-bottom:1.5px solid var(--line);background:none;padding:9px 2px;font-family:'Inter';font-size:16px;color:var(--canopy);}
  .t-thing input:focus{outline:none;border-color:var(--moss);}
  .t-note{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:14px;font-family:'Inter';font-size:15px;color:var(--canopy);resize:vertical;min-height:88px;line-height:1.55;}
  .t-note:focus{outline:none;border-color:var(--moss);}
  .save{width:100%;margin-top:22px;background:var(--canopy);color:var(--paper);border:none;border-radius:14px;padding:16px;font-family:'Inter';font-size:16px;font-weight:600;cursor:pointer;transition:background .2s;}
  .save:active{background:var(--moss);}
  .saved-note{text-align:center;font-size:13.5px;color:var(--leaf);margin-top:14px;opacity:0;transition:opacity .3s;}
  .saved-note.on{opacity:1;}

  .hidden{display:none;}
  .loading{text-align:center;padding:80px 20px;color:var(--sage);font-family:'Fraunces',serif;font-style:italic;font-size:19px;}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="loading">Coming into the light</div>
  <div id="app" class="hidden">

    <div class="date" id="date"></div>
    <h1 class="greet" id="greet"></h1>

    <div class="focus" id="focusBlock">
      <div class="focus-label">Today's focus</div>
      <ul id="focusList"></ul>
    </div>

    <div class="seg">
      <button id="tabToday" class="on" onclick="switchTab('today')">This morning</button>
      <button id="tabTomorrow" onclick="switchTab('tomorrow')">Set up tomorrow</button>
    </div>

    <!-- TODAY -->
    <div id="todayView">
      <div class="sprig-wrap"><svg id="sprig" viewBox="0 0 120 150"></svg></div>
      <div class="list" id="list"></div>
      <div class="done-msg" id="doneMsg">
        <div class="big" id="doneBig">Amazing.</div>
        <div class="sub" id="doneSub">The hard part's done. Go feel it.</div>
      </div>
      <button class="edit-toggle" id="editToggle" onclick="toggleEdit()">Edit my sequence</button>
      <div id="editPanel" class="hidden" style="margin-top:18px;">
        <div id="editRows"></div>
        <div class="addrow">
          <input id="addInput" placeholder="Add an action" maxlength="60">
          <button onclick="addItem()">Add</button>
        </div>
      </div>
    </div>

    <!-- TOMORROW -->
    <div id="tomorrowView" class="hidden">
      <p class="t-intro">Before you finish tonight, set what actually matters tomorrow. It'll be here waiting when you wake up.</p>
      <div class="t-label">Three things that matter</div>
      <div class="t-things">
        <div class="t-thing"><span class="num">1</span><input id="th0" maxlength="80" placeholder="The one that counts"></div>
        <div class="t-thing"><span class="num">2</span><input id="th1" maxlength="80" placeholder="Then this"></div>
        <div class="t-thing"><span class="num">3</span><input id="th2" maxlength="80" placeholder="And this"></div>
      </div>
      <div class="t-label">Anything else on your mind</div>
      <textarea id="tnote" class="t-note" placeholder="Get it out of your head so you don't carry it to bed."></textarea>
      <button class="save" onclick="savePlan()">Save for tomorrow</button>
      <div class="saved-note" id="savedNote">Set. Sleep easy.</div>
    </div>

  </div>
</div>

<script>
/* Durable on-device storage. Keeps the same async get/set/delete shape the
   app was written against, backed by localStorage. */
window.storage = {
  async get(key){
    const v = localStorage.getItem('intotheday:'+key);
    return v === null ? null : {value: v};
  },
  async set(key, value){
    localStorage.setItem('intotheday:'+key, value);
  },
  async delete(key){
    localStorage.removeItem('intotheday:'+key);
  }
};
/* Ask the browser to treat this app's data as persistent (never auto-evict). */
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().catch(()=>{});
}
/* Offline support + installability. */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

const DEFAULT_SEQUENCE = [
  {id:'tea', label:'Make a cup of tea'},
  {id:'brekky', label:'Make breakfast'},
  {id:'swim', label:'Swim (the pool is right there)', meta:'30 minutes. You have the time.'},
  {id:'gym', label:'Gym — leg press'}
];

let sequence = [];
let doneIds = [];
let todayPlan = null;
let editMode = false;

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function prettyDate(){
  return new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});
}
function greeting(){
  const h = new Date().getHours();
  if(h<12) return ['Good morning,','Megan'];
  if(h<17) return ['Good afternoon,','Megan'];
  return ['Good evening,','Megan'];
}

async function sGet(key){
  try{ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sSet(key,val){
  try{ await window.storage.set(key, JSON.stringify(val)); }
  catch(e){ console.error('save failed', key, e); }
}
async function sDel(key){ try{ await window.storage.delete(key); }catch(e){} }

async function init(){
  // sequence
  const savedSeq = await sGet('sequence');
  sequence = (savedSeq && savedSeq.length) ? savedSeq : DEFAULT_SEQUENCE.slice();
  // backfill meta lines onto matching default items saved before this feature existed
  let changed = false;
  sequence.forEach(it=>{
    if(!it.meta){
      const d = DEFAULT_SEQUENCE.find(x=>x.id===it.id);
      if(d && d.meta){ it.meta = d.meta; changed = true; }
    }
  });
  if(!savedSeq || changed) await sSet('sequence', sequence);

  // day rollover: if it's a new day, last night's "tomorrow" becomes today's focus, ticks reset
  const dayState = await sGet('dayState');
  const today = todayStr();
  if(!dayState || dayState.date !== today){
    const tomorrowPlan = await sGet('plan_tomorrow');
    if(tomorrowPlan){
      await sSet('plan_today', tomorrowPlan);
      await sDel('plan_tomorrow');
    }
    doneIds = [];
    await sSet('dayState', {date:today, doneIds:[]});
  } else {
    doneIds = dayState.doneIds || [];
  }

  todayPlan = await sGet('plan_today');

  // header
  document.getElementById('date').textContent = prettyDate();
  const g = greeting();
  document.getElementById('greet').innerHTML = g[0]+' <em>'+g[1]+'</em>';

  renderFocus();
  renderSprig();
  renderList();
  renderTomorrowInputs();

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}

function renderFocus(){
  const list = document.getElementById('focusList');
  const things = (todayPlan && todayPlan.things || []).filter(t=>t && t.trim());
  if(things.length===0){
    list.innerHTML = '<li class="empty">Nothing set yet. Head to "Set up tomorrow" tonight and it\'ll greet you here.</li>';
    return;
  }
  list.innerHTML = things.map((t,i)=>`<li><span>${i+1}</span>${escapeHtml(t)}</li>`).join('');
}

function renderList(){
  const el = document.getElementById('list');
  el.innerHTML = sequence.map(it=>`
    <div class="item ${doneIds.includes(it.id)?'done':''}" onclick="toggleItem('${it.id}')">
      <div class="tick"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#F3F5EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="txt">
        <div class="label">${escapeHtml(it.label)}</div>
        ${it.meta?`<div class="meta">${escapeHtml(it.meta)}</div>`:''}
      </div>
    </div>`).join('');
  renderDoneMsg();
}

function renderDoneMsg(){
  const all = sequence.length>0 && sequence.every(it=>doneIds.includes(it.id));
  document.getElementById('doneBig').classList.toggle('on', all);
  document.getElementById('doneSub').classList.toggle('on', all);
}

function toggleItem(id){
  if(editMode) return;
  if(doneIds.includes(id)) doneIds = doneIds.filter(x=>x!==id);
  else doneIds.push(id);
  sSet('dayState', {date:todayStr(), doneIds});
  renderList();
  renderSprig();
}

/* ---- growing sprig ---- */
function renderSprig(){
  const svg = document.getElementById('sprig');
  const n = sequence.length || 1;
  const doneCount = sequence.filter(it=>doneIds.includes(it.id)).length;
  const allDone = doneCount===n && n>0;

  const baseX=60, baseY=145, topY=34;
  // stem
  let html = `<path d="M${baseX} ${baseY} C ${baseX-10} ${baseY-40}, ${baseX+9} ${baseY-70}, ${baseX} ${topY+6}"
     stroke="var(--moss)" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;

  for(let i=0;i<n;i++){
    const frac = (i+1)/(n+1);
    const y = baseY - frac*(baseY-topY);
    const side = i%2===0 ? 1 : -1;
    const cx = baseX + side*3;
    const grown = i < doneCount;
    const rot = side>0 ? 38 : -38;
    // leaf shape (pointed oval)
    html += `<g class="leaf ${grown?'show':'hide'}" transform="translate(${cx} ${y}) rotate(${rot})">
       <path d="M0 0 C 14 -6, 30 -3, 34 4 C 28 11, 12 11, 0 0 Z"
         fill="${grown?'var(--leaf-bright)':'var(--sage)'}" transform="scale(${side>0?1:-1},1)"/>
       <path d="M2 1 L 28 5" stroke="rgba(35,54,42,.25)" stroke-width="1" fill="none" transform="scale(${side>0?1:-1},1)"/>
     </g>`;
  }
  // bud/flower crowns it when all done
  html += `<g class="bud ${allDone?'show':'hide'}" transform="translate(${baseX} ${topY})">
     <circle cx="0" cy="0" r="7" fill="var(--leaf-bright)"/>
     <circle cx="0" cy="0" r="3.4" fill="#EDE3B8"/>
   </g>`;

  svg.innerHTML = html;
}

/* ---- edit mode ---- */
function toggleEdit(){
  editMode = !editMode;
  document.getElementById('editPanel').classList.toggle('hidden', !editMode);
  document.getElementById('editToggle').textContent = editMode ? 'Done editing' : 'Edit my sequence';
  if(editMode) renderEditRows();
}
function renderEditRows(){
  const el = document.getElementById('editRows');
  el.innerHTML = sequence.map((it,i)=>`
    <div class="editrow">
      <div class="lbl">${escapeHtml(it.label)}</div>
      <button class="mini" onclick="moveItem(${i},-1)" ${i===0?'style="opacity:.3"':''}>↑</button>
      <button class="mini" onclick="moveItem(${i},1)" ${i===sequence.length-1?'style="opacity:.3"':''}>↓</button>
      <button class="mini" onclick="removeItem(${i})">×</button>
    </div>`).join('');
}
function moveItem(i,dir){
  const j=i+dir;
  if(j<0||j>=sequence.length) return;
  [sequence[i],sequence[j]]=[sequence[j],sequence[i]];
  persistSeq(); renderEditRows(); renderList(); renderSprig();
}
function removeItem(i){
  sequence.splice(i,1);
  persistSeq(); renderEditRows(); renderList(); renderSprig();
}
function addItem(){
  const inp = document.getElementById('addInput');
  const v = inp.value.trim();
  if(!v) return;
  sequence.push({id:'c'+Date.now(), label:v});
  inp.value='';
  persistSeq(); renderEditRows(); renderList(); renderSprig();
}
function persistSeq(){ sSet('sequence', sequence); }

/* ---- tomorrow ---- */
async function renderTomorrowInputs(){
  const plan = await sGet('plan_tomorrow');
  if(plan){
    (plan.things||[]).forEach((t,i)=>{const e=document.getElementById('th'+i); if(e) e.value=t;});
    if(plan.note) document.getElementById('tnote').value = plan.note;
  }
}
async function savePlan(){
  const things = [0,1,2].map(i=>document.getElementById('th'+i).value.trim());
  const note = document.getElementById('tnote').value.trim();
  await sSet('plan_tomorrow', {things, note});
  const n = document.getElementById('savedNote');
  n.classList.add('on');
  setTimeout(()=>n.classList.remove('on'), 2600);
}

function switchTab(which){
  const t = which==='today';
  document.getElementById('todayView').classList.toggle('hidden', !t);
  document.getElementById('tomorrowView').classList.toggle('hidden', t);
  document.getElementById('tabToday').classList.toggle('on', t);
  document.getElementById('tabTomorrow').classList.toggle('on', !t);
}

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

init();
</script>
</body>
</html>
